<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="IE=edge" http-equiv="X-UA-Compatible" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Document</title>
    <link href="default.css" rel="stylesheet" />
    <link href="layout.css" rel="stylesheet" />

    <script src="./main.ts" type="module"></script>
  </head>
  <body>
    <header>
      <h1>Contact</h1>
    </header>

    <section>
      <ul>
        <li>
          <a href="/" title="Home"
            ><i class="fa-solid fa-home"></i> <span>Home</span></a
          >
        </li>
        <li>
          <a href="/" title="Dashboard"
            ><i class="fa-solid fa-dashboard"></i> <span>Dashboard</span></a
          >
        </li>
        <li>
          <a href="/" title="Profile"
            ><i class="fa-solid fa-user"></i> <span>Profile</span></a
          >
        </li>
        <li>
          <a href="./contact.html" title="Contact"
            ><i class="fa-solid fa-message"></i> <span>Contact</span></a
          >
        </li>
      </ul>
    </section>

    <main class="main_contact">
      <form>
        <div class="form-wrapper">
          <label for="name_contact">
            Name: 
          </label>
          <input type="text" name="name_contact" id="name_contact" minlength="3">
        </div>
        
        <div class="form-wrapper">
          <label for="age_contact">
            Age: 
          </label>
          <input type="number" name="age_contact" id="age_contact" max="100" min="0" >
        </div>
       
        <div class="form-wrapper">
          <label for="color_contact">
            Favourite color: 
          </label>
          <input type="color" name="color_contact">
        </div>
        

        <div class="form-wrapper">
          <div class="form-wrapper">
            <label for="food_contact">
              Favourite food (from these): 
            </label>
          </div>
          <div class="form-wrapper form-wrapper-radio">
            <label for="food_contact_taco">Taco</label>
            <input type="radio" id="food_contact_taco" name="food_contact" value="taco" required>
          </div>
          
          <div class="form-wrapper form-wrapper-radio">
            <label for="food_contact_pizza">Pizza</label>
            <input type="radio" id="food_contact_pizza" name="food_contact" value="pizza">
          </div>

          <div class="form-wrapper form-wrapper-radio">
            <label for="food_contact_sushi">Sushi</label>
            <input type="radio" id="food_contact_sushi" name="food_contact" value="sushi">
          </div>

          <div class="form-wrapper form-wrapper-radio">
            <label for="food_contact_burger">Burger</label>
            <input type="radio" id="food_contact_burger" name="food_contact" value="burger"> 
          </div> 

          <input type="submit" >
          

        </div>
        



      </form>
    </main>

    <footer>
      <div>Made with <i class="fa-solid fa-heart"></i> by David Sichau</div>
    </footer>
  </body>
</html>
